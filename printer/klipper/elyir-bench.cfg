# Elyir Bench's start macro, added by Elyir Bench with your OK.
#
# What this file does
#   Two macros your slicer can put around the start G-code you already have:
#
#     ELYIR_BENCH_PRINT_START BED=<temp> EXTRUDER=<temp> [CHAMBER=<temp>]
#     ... your start G-code, unchanged (your PRINT_START or START_PRINT line) ...
#     ELYIR_BENCH_PRINT_START_DONE
#
#   The first heats the bed (and waits for the chamber, if you set that up
#   below) while the print is paused, so Cancel works at once during the
#   longest wait. Then it lets your own start G-code run exactly as before:
#   your homing, leveling, mesh and purge. The bed is already hot, so your
#   own M190 or heat-up finds it there. The second line tells Elyir Bench your
#   start G-code is done and puts back the first layer you kept in Elyir Bench
#   (squish more or less), for this print only: it comes off again when the
#   print ends, so a print started from anywhere else isn't moved by it.
#
#   Files without these lines print exactly as they always have. Nothing here
#   replaces or renames any of your macros.
#
# Removing it
#   Delete the [include elyir-bench.cfg] line from printer.cfg (Elyir Bench does
#   this for you from Care) and take the two lines out of your slicer's start
#   G-code. Files already sliced with them still print: Klipper skips the two
#   unknown lines with a note, and your own start G-code heats as it always did.
#
# Settings
#   To change one, copy the [gcode_macro _ELYIR_BENCH_PRINT_START_SETTINGS]
#   heading, a "gcode:" line, and only the lines you change into printer.cfg,
#   BELOW the [include elyir-bench.cfg] line. Klipper merges the two; yours wins.
#   The gcode: line lets your copy stand on its own if this file is taken out.
#   Elyir Bench updates this file, so changes made here are lost.
#
# Klipper runs one command at a time. A start macro that waits with M190 or
# TEMPERATURE_WAIT holds Klipper for the whole wait, so Cancel queues behind it.
# Here the heaters are switched on, the file is paused, and a 1-second timer
# checks the temperatures; between checks nothing holds Klipper.
#
# What Elyir Bench reads (printer['gcode_macro _ELYIR_BENCH_PRINT_START']):
#   stage  ''          not getting ready
#          'warming'   the bed (and the nozzle, to a warm 150) heating up
#          'soaking'   waiting for the chamber, or a timed soak
#          'own'       your own start G-code is running
#   ELYIR_BENCH_PRINT_START_DONE clears it.

[gcode_macro _ELYIR_BENCH_PRINT_START_SETTINGS]
description: Settings for ELYIR_BENCH_PRINT_START (override below the include)
# Nozzle temperature while the bed heats: warm, not hot enough to ooze.
# Your own start G-code takes it to the printing temperature.
variable_nozzle_warm: 150
# Wait for the chamber, at most this hot (C). 0 = never wait. A slicer's
# CHAMBER= is capped by this. Needs a chamber temperature sensor.
variable_chamber_max: 0
# Which sensor; "" = the first temperature_sensor named chamber or enclosure.
variable_chamber_sensor: ""
# Minutes to wait for the chamber before carrying on without it.
variable_chamber_timeout: 20
# Minutes to keep the bed hot before your start G-code runs. 0 = none.
variable_soak_minutes: 0
# Give up and cancel if heating takes longer than this (minutes).
variable_max_minutes: 60
# Home before heating. For configs whose CANCEL_PRINT moves the head without
# checking it's homed (RatOS, Sovol): Cancel while heating then still works.
variable_home_first: False
gcode:
  {action_respond_info("Settings for ELYIR_BENCH_PRINT_START. See the top of elyir-bench.cfg.")}

[gcode_macro ELYIR_BENCH_PRINT_START]
description: Heat while paused (Cancel works), then run your own start G-code
gcode:
  {% set s = printer['gcode_macro _ELYIR_BENCH_PRINT_START_SETTINGS'] %}
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {% if st.stage in ('warming', 'soaking') %}
    {action_raise_error("ELYIR_BENCH_PRINT_START is already running (%s)" % st.stage)}
  {% endif %}
  # Temperatures, under the names slicers and other macros use
  {% set has_bed = 'heater_bed' in printer %}
  {% set bed = (params.BED or params.BED_TEMP or params.BEDTEMP
                or (printer.heater_bed.target if has_bed else 0))|float %}
  {% set extruder = (params.EXTRUDER or params.EXTRUDER_TEMP or params.HOTEND
                     or params.HOTEND_TEMP or params.NOZZLE or 0)|float %}
  {% set warm = s.nozzle_warm|float %}
  {% if extruder > 0 and extruder < warm %}
    {% set warm = extruder %}
  {% endif %}
  # The chamber: the slicer's temperature, capped by chamber_max
  {% set chamber_max = s.chamber_max|float %}
  {% set ns = namespace(sensor=s.chamber_sensor) %}
  {% if chamber_max > 0 and not ns.sensor %}
    {% for name in printer %}
      {% set low = name|lower %}
      {% if not ns.sensor and low.startswith('temperature_sensor ')
            and ('chamber' in low or 'enclosure' in low) %}
        {% set ns.sensor = name %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% set chamber = (params.CHAMBER or params.CHAMBER_TEMP or chamber_max)|float %}
  {% if chamber > chamber_max %}
    {% set chamber = chamber_max %}
  {% endif %}
  {% if chamber > 0 and (not ns.sensor or ns.sensor not in printer) %}
    {action_respond_info("ELYIR_BENCH_PRINT_START: no chamber sensor, not waiting for the chamber")}
    {% set chamber = 0 %}
  {% endif %}
  {% set now = printer.toolhead.estimated_print_time %}
  {% set idle_cfg = printer.configfile.settings.get('idle_timeout', {}).get('timeout', 600) %}
  {% set idle = printer.idle_timeout.idle_timeout|default(idle_cfg) %}
  # The pause without parking: your PAUSE macro's original command when it renamed one
  {% set pause_cmd = printer.configfile.settings.get('gcode_macro pause', {}).get('rename_existing') or 'PAUSE' %}
  {% set from_file = printer.virtual_sdcard.is_active|default(False) %}

  # A first layer kept for the last print comes off before your start G-code
  # runs; ELYIR_BENCH_PRINT_START_DONE puts this print's back on.
  {% if st.applied_z != 0 %}
    SET_GCODE_OFFSET Z_ADJUST={'%.3f' % (0 - st.applied_z)}
    SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=applied_z VALUE=0.0
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=bed VALUE={bed}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=warm VALUE={warm}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=chamber VALUE={chamber}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=sensor VALUE='"{ns.sensor}"'
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=started VALUE={now}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=since VALUE={now}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=idle_timeout VALUE={idle}

  {% if has_bed and bed > 0 %}
    M140 S{bed}
  {% endif %}
  M104 S{warm}
  {% if s.home_first and printer.toolhead.homed_axes != 'xyz' %}
    M117 Homing...
    G28
  {% endif %}
  {% if not from_file %}
    # Run from the console, not a file: nothing to pause, so wait the plain way
    {% if has_bed and bed > 0 %}
      M190 S{bed}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=stage VALUE='"own"'
  {% else %}
    SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=stage VALUE='"warming"'
    M117 Pre-heating bed...
    # Heaters stay on through a long chamber wait
    SET_IDLE_TIMEOUT TIMEOUT={[idle, (s.max_minutes|float + 10) * 60]|max}
    # Stop reading the file here; the timer resumes it when the bed is ready
    {pause_cmd}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_PRINT_START_TICK DURATION=1

[gcode_macro ELYIR_BENCH_PRINT_START_DONE]
description: Your start G-code is done: the first layer you kept, then print
gcode:
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {% if st.stage %}
    # The first layer kept in Elyir Bench ([save_variables] first_layer_z, mm,
    # + is further from the bed). Only when it was kept the way this printer
    # finds Z ("scan": a probe or an endstop), and never more than 0.5 mm.
    {% set sv = printer.save_variables.variables if 'save_variables' in printer else {} %}
    {% set z = sv.get('first_layer_z', 0)|float %}
    # ...or the sheet on the bed's own value, when one is on (first_layer_sheets, first_layer_sheet)
    {% set sheets = sv.get('first_layer_sheets', {}) %}
    {% set sheet = sv.get('first_layer_sheet', '')|string %}
    {% if sheet and sheet in sheets %}
      {% set z = sheets[sheet]['z']|float %}
    {% endif %}
    {% if sv.get('first_layer_against', 'scan')|string != 'scan' %}
      {% set z = 0 %}
    {% elif z|abs > 0.5 %}
      {action_respond_info("First layer: the kept %+.3f mm is more than 0.5 mm, not using it" % z)}
      {% set z = 0 %}
    {% endif %}
    {% if z != 0 %}
      {action_respond_info("First layer: %+.3f mm, as kept in Elyir Bench" % z)}
      SET_GCODE_OFFSET Z_ADJUST={'%.3f' % z}
      SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=applied_z VALUE={'%.3f' % z}
      # ...and off again when this print ends, however it ends
      UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_FIRST_LAYER_WATCH DURATION=5
    {% endif %}
  {% endif %}
  _ELYIR_BENCH_PRINT_START_END
  M117 Printing...

[gcode_macro _ELYIR_BENCH_PRINT_START]
description: State of ELYIR_BENCH_PRINT_START (stage is '' when not getting ready)
variable_stage: ''
variable_bed: 0.0
variable_warm: 0.0
variable_chamber: 0.0
variable_sensor: ''
variable_started: 0.0
variable_since: 0.0
variable_idle_timeout: 0.0
variable_applied_z: 0.0
gcode:
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {action_respond_info("ELYIR_BENCH_PRINT_START stage='%s' bed=%.0f nozzle=%.0f chamber=%.0f first layer=%+.3f"
     % (st.stage, st.bed, st.warm, st.chamber, st.applied_z))}

[delayed_gcode _ELYIR_BENCH_PRINT_START_TICK]
gcode:
  # The next tick first: if this step fails, the next one still runs.
  UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_PRINT_START_TICK DURATION=1
  _ELYIR_BENCH_PRINT_START_STEP

[gcode_macro _ELYIR_BENCH_PRINT_START_STEP]
gcode:
  {% set s = printer['gcode_macro _ELYIR_BENCH_PRINT_START_SETTINGS'] %}
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {% set state = printer.print_stats.state %}
  {% set now = printer.toolhead.estimated_print_time %}
  {% set has_bed = 'heater_bed' in printer %}
  {% set bed_t = printer.heater_bed.temperature if has_bed else 0 %}
  {% set ext_t = printer.extruder.temperature %}
  {% set resume_cmd = printer.configfile.settings.get('gcode_macro resume', {}).get('rename_existing') or 'RESUME' %}

  {% if not st.stage %}
    UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_PRINT_START_TICK DURATION=0

  {% elif state not in ('printing', 'paused') %}
    # Cancelled, finished or failed: stop getting ready. Cancelled while the
    # heaters were ours: make sure they're off, even if a CANCEL_PRINT macro
    # stopped partway (one that moves an unhomed head does).
    {% if st.stage in ('warming', 'soaking') %}
      TURN_OFF_HEATERS
    {% endif %}
    _ELYIR_BENCH_PRINT_START_END

  {% elif st.stage == 'own' %}
    # Your start G-code is running. If the DONE line is missing, the first
    # layer starting (when the slicer reports layers) ends it instead.
    {% if printer.print_stats.info.current_layer|default(0, true) >= 1 %}
      _ELYIR_BENCH_PRINT_START_END
    {% endif %}

  {% elif not printer.pause_resume.is_paused %}
    # Someone resumed by hand: your own start G-code heats the rest of the way
    {action_respond_info("Resumed before the bed was ready; your start G-code takes it from here.")}
    _ELYIR_BENCH_PRINT_START_GO

  {% elif now - st.started > s.max_minutes|float * 60 %}
    {action_respond_info("Heating took more than %d minutes (at '%s'). Stopping the print." % (s.max_minutes, st.stage))}
    _ELYIR_BENCH_PRINT_START_END
    CANCEL_PRINT
    M117 Print start timed out

  {% elif (st.bed > 0 and has_bed and printer.heater_bed.target == 0) or (st.warm > 0 and printer.extruder.target == 0) %}
    {action_respond_info("A heater was turned off while getting ready. Stopping the print.")}
    _ELYIR_BENCH_PRINT_START_END
    CANCEL_PRINT
    M117

  {% elif st.stage == 'warming' %}
    {% if bed_t >= st.bed - 1 and ext_t >= st.warm - 2 %}
      {% if st.chamber > 0 or s.soak_minutes|float > 0 %}
        _ELYIR_BENCH_PRINT_START_STAGE STAGE=soaking
      {% else %}
        {resume_cmd}
        _ELYIR_BENCH_PRINT_START_GO
      {% endif %}
    {% else %}
      M117 Pre-heating: bed {'%.0f' % bed_t}/{'%.0f' % st.bed}C
    {% endif %}

  {% elif st.stage == 'soaking' %}
    {% set soak_left = s.soak_minutes|float * 60 - (now - st.since) %}
    {% set chamber_t = printer[st.sensor].temperature if st.chamber > 0 else 0 %}
    {% set chamber_ok = st.chamber <= 0 or chamber_t >= st.chamber %}
    {% set chamber_late = now - st.since > s.chamber_timeout|float * 60 %}
    {% if soak_left <= 0 and (chamber_ok or chamber_late) %}
      {% if not chamber_ok %}
        {action_respond_info("The chamber only reached %.0fC of %.0fC. Carrying on." % (chamber_t, st.chamber))}
      {% endif %}
      {resume_cmd}
      _ELYIR_BENCH_PRINT_START_GO
    {% elif not chamber_ok %}
      M117 Heat-soaking: chamber {'%.0f' % chamber_t}/{'%.0f' % st.chamber}C
    {% else %}
      M117 Heat-soaking bed, {'%d' % (soak_left / 60 + 0.99)} min left
    {% endif %}
  {% endif %}

# The bed is ready: your own start G-code runs next.
[gcode_macro _ELYIR_BENCH_PRINT_START_GO]
gcode:
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {% if st.idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={st.idle_timeout}
  {% endif %}
  _ELYIR_BENCH_PRINT_START_STAGE STAGE=own

[gcode_macro _ELYIR_BENCH_PRINT_START_STAGE]
gcode:
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=stage VALUE='"{params.STAGE}"'
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=since VALUE={printer.toolhead.estimated_print_time}

# Leave the getting-ready state: stop the timer, put idle_timeout back.
[gcode_macro _ELYIR_BENCH_PRINT_START_END]
gcode:
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_PRINT_START_TICK DURATION=0
  {% if st.stage in ('warming', 'soaking') and st.idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={st.idle_timeout}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=stage VALUE='""'

# The first layer kept in Elyir Bench is for the print it was applied to. When that
# print is over (finished, cancelled or failed), take off exactly what was added,
# so any babystepping done during the print stays as it was.
[delayed_gcode _ELYIR_BENCH_FIRST_LAYER_WATCH]
gcode:
  {% set st = printer['gcode_macro _ELYIR_BENCH_PRINT_START'] %}
  {% if st.applied_z == 0 %}
    # nothing applied: nothing to watch
  {% elif printer.print_stats.state in ('printing', 'paused') %}
    UPDATE_DELAYED_GCODE ID=_ELYIR_BENCH_FIRST_LAYER_WATCH DURATION=5
  {% else %}
    {action_respond_info("First layer: the print is over, taking off the kept %+.3f mm" % st.applied_z)}
    SET_GCODE_OFFSET Z_ADJUST={'%.3f' % (0 - st.applied_z)} MOVE=0
    SET_GCODE_VARIABLE MACRO=_ELYIR_BENCH_PRINT_START VARIABLE=applied_z VALUE=0
  {% endif %}

# ---- Only when this printer has no M600 of its own -------------------------
# Elyir Bench leaves this section out when your config already defines M600;
# Klipper would otherwise merge the two, or refuse to start.
[gcode_macro M600]
description: Color change: pause so the filament can be swapped
gcode:
  {action_respond_info("M600: color change. Swap the filament, then resume.")}
  PAUSE
# ---- end M600 ----------------------------------------------------------------
