# Bench's filament-unit service (units/service.py): what Klipper needs for it. Written by the installer, which
# fills in the extruder sensor's pin; replaces KlipperACE's [ace] section and its T0..T7.

{head_sensor}
# The sensor's pin is the filament_switch_sensor's too. A gcode_button on it pushes each edge to the service at
# once: action_call_remote_method runs while Klipper renders the template, ahead of any queued G-code.
[duplicate_pin_override]
pins: {sensor_bare}

[gcode_button elyir_units_sensor]
pin: {sensor_pin}
press_gcode: {{action_call_remote_method("elyir_sensor", state="pressed")}}
release_gcode: {{action_call_remote_method("elyir_sensor", state="released")}}

# How much to push through after the next tool change, worked out by Bench's slicer for the pair of colors and
# written on the line before the T (design/multi-color/). -1: the after-change macro's own amount.
[gcode_macro ELYIR_PURGE]
description: The purge length for the next tool change, in mm (Bench's slicer writes it)
variable_length: -1
gcode:
  SET_GCODE_VARIABLE MACRO=ELYIR_PURGE VARIABLE=length VALUE={{params.LENGTH|default(-1)|float}}

# A tool change: in a print the file pauses without parking and the service does the change, then resumes it.
# The remote method fires as the template renders, before PAUSE_BASE runs; the service waits for the pause.
[gcode_macro ELYIR_TOOL]
description: Change to a filament unit's slot (Bench's filament-unit service)
gcode:
  {{% set printing = printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}}
  {{action_call_remote_method("elyir_tool", tool=params.T|int, in_print=printing, purge=printer["gcode_macro ELYIR_PURGE"].length)}}
  SET_GCODE_VARIABLE MACRO=ELYIR_PURGE VARIABLE=length VALUE=-1
  {{% if printing %}}
  PAUSE_BASE
  {{% endif %}}
{tool_macros}
