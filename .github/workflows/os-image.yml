# The flashable cards for a Raspberry Pi 4 and a Pi 5, and the same OS as an update bundle for each, built here
# in the open (image/build.sh, docs/image.md). Run it from the Actions tab.
#
# Nothing goes live from here. The cards and the bundles go up to https://releases.elyir.dev/bench/os/ under their
# own names, each with a .sha256, and built-<board>.json names them. The bundles aren't signed: the release key
# isn't in GitHub. A maintainer downloads each, signs it, and publishes the update feed and the card's download
# together, on their own machine. A card is never offered before its own OS is the feed's: a printer updates to
# whatever the feed names, so a newer card ahead of it would go back to the older OS.
#
# Secrets in the "release" environment: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT (R2's S3 API).
name: OS image

on:
  workflow_dispatch:
    inputs:
      boards:
        description: Which boards (JSON list)
        default: '["pi4", "pi5"]'

concurrency:
  group: os-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  card:
    strategy:
      fail-fast: false             # one board's card is worth having without the other's
      matrix:
        board: ${{ fromJSON(inputs.boards) }}
    name: card (${{ matrix.board }})
    runs-on: ubuntu-24.04-arm      # the cards are arm64: native here, no emulation
    timeout-minutes: 60
    environment: release
    env:
      BUCKET: elyir-releases
      PREFIX: bench/os
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4

      - name: Room for the build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Version
        run: |
          # named after the private commit it was exported from, like the app's releases
          private="$(git log -1 --format=%B | sed -n 's/.*from private revision \([0-9a-f]\{7,\}\).*/\1/p' | head -1)"
          echo "VERSION=$(git log -1 --format=%cd --date=format:%Y.%m.%d)-${private:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"

      - name: The aws CLI (R2 takes ~900 MB only in parts, through its S3 API)
        run: |
          command -v aws && exit 0
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o "$RUNNER_TEMP/aws.zip"
          unzip -q "$RUNNER_TEMP/aws.zip" -d "$RUNNER_TEMP" && sudo "$RUNNER_TEMP/aws/install"

      - name: Not built before
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3api head-object --bucket "$BUCKET" \
               --key "$PREFIX/elyir-bench-os-$VERSION-$BOARD.tar" >/dev/null 2>&1; then
            echo "::error::$VERSION for $BOARD is already built; a release is never replaced. Export something new first."
            exit 1
          fi

      - name: The app release
        run: |
          (cd app && npm ci --no-audit --no-fund)
          release="$(RELEASE_VERSION="$VERSION" scripts/build-release.sh | tail -n 1)"
          [ -f "$release" ] || { echo "::error::build-release.sh didn't name a tarball (got: $release)"; exit 1; }
          echo "RELEASE=$release" >> "$GITHUB_ENV"

      - name: The card and the OS bundle
        run: |
          image/build.sh
          ls -la dist/

      - name: No SSH key on the card
        run: |
          docker run --rm --privileged -v elyir-imagework:/work:ro -e BOARD elyir-imagegen bash -euc '
            m=$(mktemp -d); mount -o ro,loop "$(ls "/work/elyir-$BOARD"/image-*/root.ext4 | head -1)" "$m"
            k="$m/home/pi/.ssh/authorized_keys"
            if [ -s "$k" ]; then echo "the card has an SSH key in it" >&2; umount "$m"; exit 1; fi
            umount "$m"'

      - name: Up to releases.elyir.dev, not live
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          cd dist
          card="elyir-bench-$VERSION-$BOARD.img.xz"; bundle="elyir-bench-os-$VERSION-$BOARD.tar"
          [ -f "$card" ] && [ -f "$bundle" ] || { echo "::error::image/build.sh didn't make $card and $bundle"; exit 1; }
          sha256sum "$card" > "$card.sha256"; sha256sum "$bundle" > "$bundle.sha256"
          cat > "built-$BOARD.json" <<JSON
          {
            "version": "$VERSION",
            "board": "$BOARD",
            "card": "$card",
            "card_sha256": "$(cut -d' ' -f1 "$card.sha256")",
            "card_size": $(stat -c %s "$card"),
            "file": "$bundle",
            "sha256": "$(cut -d' ' -f1 "$bundle.sha256")",
            "size": $(stat -c %s "$bundle"),
            "commit": "$GITHUB_SHA",
            "run": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat "built-$BOARD.json"
          # R2 sometimes times out waiting for a part's answer (AWS_ERROR_HTTP_RESPONSE_FIRST_BYTE_TIMEOUT), and a
          # failed upload leaves nothing behind, so each file gets three tries
          s3() {
            for try in 1 2 3; do
              aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 cp --only-show-errors "$@" && return 0
              echo "::warning::upload try $try of 3 failed: $1"; sleep 15
            done
            return 1
          }
          forever="public, max-age=31536000, immutable"
          s3 "$card" "s3://$BUCKET/$PREFIX/$card" --content-type application/x-xz --cache-control "$forever"
          s3 "$card.sha256" "s3://$BUCKET/$PREFIX/$card.sha256" --content-type text/plain --cache-control "$forever"
          s3 "$bundle" "s3://$BUCKET/$PREFIX/$bundle" --content-type application/x-tar --cache-control "$forever"
          s3 "$bundle.sha256" "s3://$BUCKET/$PREFIX/$bundle.sha256" --content-type text/plain --cache-control "$forever"
          s3 "built-$BOARD.json" "s3://$BUCKET/$PREFIX/built-$BOARD.json" --content-type application/json --cache-control no-cache
          echo "### Built $VERSION for $BOARD, not live yet" >> "$GITHUB_STEP_SUMMARY"
          echo "Sign and publish it with \`BOARD=$BOARD scripts/release/sign-os.sh $VERSION\`." >> "$GITHUB_STEP_SUMMARY"
