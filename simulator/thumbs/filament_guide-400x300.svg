<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4d4d4"/></linearGradient>
    <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8c8c8"/><stop offset="1" stop-color="#a9a9a9"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- mounting foot -->
    <polygon points="70,222 180,250 230,228 120,200" fill="url(#w)"/>
    <polygon points="70,222 180,250 180,264 70,236" fill="url(#ws)"/>
    <!-- arm rising to the loop -->
    <polygon points="150,226 190,236 268,110 236,102" fill="url(#w)"/>
    <polygon points="190,236 204,230 280,106 268,110" fill="url(#ws)"/>
    <!-- the guide loop -->
    <circle cx="268" cy="86" r="42" fill="url(#w)"/>
    <circle cx="268" cy="86" r="20" fill="#3a3a3a" opacity=".55"/>
    <circle cx="268" cy="86" r="14" fill="#1e1e1e" opacity=".6"/>
  </g>
</svg>
