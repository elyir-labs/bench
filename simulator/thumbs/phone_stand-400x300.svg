<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e46b66"/><stop offset="1" stop-color="#b93a36"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c94743"/><stop offset="1" stop-color="#9d2f2c"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d9d9"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- base slab, isometric -->
    <polygon points="60,200 220,240 340,190 180,150" fill="url(#r1)"/>
    <polygon points="60,200 220,240 220,262 60,222" fill="url(#r2)"/>
    <polygon points="220,240 340,190 340,212 220,262" fill="#8e2a27"/>
    <!-- white insert on the slab -->
    <polygon points="110,198 215,224 300,190 195,165" fill="url(#w1)"/>
    <!-- back rest -->
    <polygon points="175,152 300,182 300,80 175,50" fill="url(#r1)"/>
    <polygon points="300,182 340,166 340,64 300,80" fill="#a63431"/>
    <polygon points="175,50 300,80 340,64 215,34" fill="#f08a85"/>
    <!-- white lip -->
    <polygon points="118,190 205,212 205,196 118,174" fill="url(#w1)"/>
    <polygon points="205,212 235,200 235,184 205,196" fill="#cfcfcf"/>
  </g>
</svg>
