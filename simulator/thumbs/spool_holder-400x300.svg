<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a4f"/><stop offset="1" stop-color="#1c1c1f"/></linearGradient>
    <linearGradient id="kd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#111113"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- wall bracket -->
    <polygon points="60,70 110,56 110,236 60,250" fill="url(#kd)"/>
    <polygon points="110,56 128,62 128,242 110,236" fill="#38383d"/>
    <!-- the arm -->
    <polygon points="110,140 300,110 312,122 122,154" fill="url(#k)"/>
    <polygon points="122,154 312,122 312,140 122,172" fill="url(#kd)"/>
    <!-- the hub that the spool turns on -->
    <ellipse cx="300" cy="128" rx="34" ry="44" fill="url(#k)" stroke="#5c5c62" stroke-width="2"/>
    <ellipse cx="300" cy="128" rx="16" ry="21" fill="#0e0e10"/>
    <ellipse cx="330" cy="128" rx="10" ry="40" fill="#2f2f34"/>
  </g>
</svg>
